name: whileisleep
services:
  web:
    build: .
    command: bash -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    # Mounted so code changes reload without a rebuild.
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_PORT:-8004}:8000"
    env_file:
      - .env
    environment: &backend-environment
      # Inside the compose network the database is the "db" service.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # The cache (database 0) and the job queue (database 1).
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:2

  # The live streams (apps/realtime/views.py) on ASGI. The frontend's dev server proxies
  # /api/v1/.../stream here (STREAM_URL); reloads when the code changes, without waiting for open
  # streams, which would never end by themselves.
  stream:
    build: .
    command: uvicorn whileisleep.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir apps --reload-dir whileisleep --timeout-graceful-shutdown 2
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${STREAM_PORT:-8009}:8000"
    env_file:
      - .env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:2

  # Writes the AI's replies (apps/agent/tasks.py). Restarts itself when the code changes.
  worker:
    build: .
    command: python manage.py devworker
    volumes:
      - .:/app
    env_file:
      - .env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:2

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Localhost only, so the database is not reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5448}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
