# The backend, in development and production. DJANGO_SETTINGS_MODULE in .env decides which: with
# whileisleep.settings.local the servers reload when the code changes; with anything else
# they run as in production. COMPOSE_PROFILES=production in .env also starts
# the services that only production needs. The frontend runs on the host, with pm2 in production.
# frontend/content/docs/self-hosting.md walks through it.
#
# Every port is on localhost only; a tunnel or reverse proxy on the host reaches them.
name: whileisleep

x-backend: &backend
  build: .
  volumes:
    # So code changes reload without a rebuild.
    - .:/app
  env_file:
    - .env
  environment:
    # Inside the compose network the database is the "db" service.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # The cache (database 0) and the job queue (database 1).
    REDIS_URL: redis://redis:6379/0
  # They start once the API is healthy, so after its migrations.
  depends_on:
    web:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *backend
    command: >
      bash -c 'python manage.py migrate --noinput || exit 1;
      if [ "$$DJANGO_SETTINGS_MODULE" = "whileisleep.settings.local" ]; then
        exec python manage.py runserver 0.0.0.0:8000;
      else
        python manage.py collectstatic --noinput &&
        exec gunicorn whileisleep.wsgi --bind 0.0.0.0:8000 --workers 3 --threads 8 --timeout 90 --access-logfile -;
      fi'
    ports:
      - "127.0.0.1:${WEB_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Under the site's own host name: Django refuses any other in production.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = (os.environ.get("SITE_URL") or "localhost").rstrip("/").split("//")[-1]
          urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/api/v1/ready", headers={"Host": host}), timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The live streams (apps/realtime/views.py) on ASGI: an open widget costs a coroutine, not a
  # thread. In development the reload doesn't wait for open streams, which would never end by
  # themselves.
  stream:
    <<: *backend
    command: >
      bash -c 'if [ "$$DJANGO_SETTINGS_MODULE" = "whileisleep.settings.local" ]; then
        exec uvicorn whileisleep.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir apps --reload-dir whileisleep --timeout-graceful-shutdown 2;
      else
        exec uvicorn whileisleep.asgi:application --host 0.0.0.0 --port 8000 --no-access-log --timeout-graceful-shutdown 10;
      fi'
    ports:
      - "127.0.0.1:${STREAM_PORT:-8104}:8000"

  # Writes the AI's replies (apps/agent/tasks.py). Threads, because a reply spends its time
  # waiting on the LLM. In development it also does the work of `integrations` and `beat`, and
  # restarts itself when the code changes.
  worker:
    <<: *backend
    command: >
      bash -c 'if [ "$$DJANGO_SETTINGS_MODULE" = "whileisleep.settings.local" ]; then
        exec python manage.py devworker;
      else
        exec celery -A whileisleep worker --pool threads --concurrency 16 --loglevel info;
      fi'
    # A reply in progress gets time to finish before the container is stopped.
    stop_grace_period: 150s

  # Talks to outside services for the integrations (Slack, webhooks). They can be slow, so it is
  # not the worker that writes AI replies. At most DELIVERY_THREADS (8) of the 16 send events; the
  # rest are for replies coming in from Slack and for the dashboard.
  integrations:
    <<: *backend
    profiles: ["production"]
    command: celery -A whileisleep worker -Q integrations,deliveries --pool threads --concurrency 16 --loglevel info
    stop_grace_period: 60s

  # The scheduler: once a minute it asks the worker to look for visitor messages whose
  # reply job was lost. Exactly one of these, never scaled.
  beat:
    <<: *backend
    profiles: ["production"]
    command: celery -A whileisleep beat --loglevel info --schedule /tmp/celerybeat-schedule

  redis:
    image: redis:7-alpine
    # Holds the queue of AI replies waiting for a worker. Every write is logged to disk within a
    # second, so a restart doesn't drop queued replies.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  db:
    image: postgres:17
    # POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD.
    env_file:
      - .env
    # Localhost only, so the database is not reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5448}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
