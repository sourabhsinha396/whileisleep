name: whileisleep
services:
  web:
    build: .
    command: bash -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    # Mounted so code changes reload without a rebuild.
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_PORT:-8004}:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database is the "db" service.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:2

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Localhost only, so the database is not reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5448}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
