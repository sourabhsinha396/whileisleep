[project]
name = "whileisleep-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.5",
    "cryptography>=44",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.8.0",
    "email-validator>=2.4.0",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.4",
    "redis>=5",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "whileisleep.settings.testing"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*"]
cache-dir = ".venv/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Demo content is prose; wrapping it would hurt readability.
"apps/workspaces/management/commands/seed_demo.py" = ["E501"]
