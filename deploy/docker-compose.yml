# whileisleep in production on one server (a VM, or any Docker host).
#
#   cd deploy && cp .env.example .env    # fill it in
#   docker compose up -d --build
#
# frontend/content/docs/self-hosting.md walks through it. Only Caddy is reachable from outside; it gets and
# renews the TLS certificate for SITE_DOMAIN by itself.
#
#   caddy ─┬─ web (Django API, WSGI) ───┬─ db (Postgres: everything that must survive)
#          ├─ stream (live updates, ASGI) ┴─ redis (the reply queue, counters, locks,
#          └─ frontend (Next.js)               presence, and pub/sub for live updates)
#                                              └─ worker (writes AI replies), integrations (Slack,
#                                                 webhooks) and beat (scheduler)

# Not "whileisleep": that is the development stack in backend/, and sharing the name would
# share its database volume.
name: whileisleep-prod

x-backend: &backend
  build: ../backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: whileisleep.settings.production
    SITE_URL: https://${SITE_DOMAIN}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Losing this volume means asking Let's Encrypt again (rate-limited).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - stream
      - frontend
    restart: unless-stopped

  # Runs once per deploy, before the app starts: database migrations and static files.
  release:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend
    volumes:
      - static:/app/staticfiles:ro
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck: &healthcheck
      # Asks the app itself, under the site's own host name: Django refuses any other.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["SITE_URL"].removeprefix("https://")
          urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/api/v1/ready", headers={"Host": host}), timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The live streams (backend/apps/realtime/views.py): server-sent events for the widget and
  # the inbox, fanned out from Redis. Async views on uvicorn, so an open widget costs a
  # coroutine, not a thread; one process holds thousands. Caddy sends it only the stream
  # paths. On a restart open streams are cut after 10 seconds and the browsers reconnect.
  stream:
    <<: *backend
    command: uvicorn whileisleep.asgi:application --host 0.0.0.0 --port 8000 --no-access-log --timeout-graceful-shutdown 10
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck: *healthcheck

  # Writes the AI's replies (backend/apps/agent/tasks.py). Threads, because a reply spends
  # its time waiting on the LLM: 16 replies can be in progress at once. To handle more, raise
  # --concurrency or run more of this service (docker compose up -d --scale worker=2).
  worker:
    <<: *backend
    command: celery -A whileisleep worker --pool threads --concurrency 16 --loglevel info
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_started
    # A reply in progress gets time to finish before the container is stopped.
    stop_grace_period: 150s

  # Talks to outside services for the integrations (Slack, webhooks). They can be slow, so it is
  # not the worker that writes AI replies. At most DELIVERY_THREADS (8) of the 16 send events; the
  # rest are for replies coming in from Slack and for the dashboard.
  integrations:
    <<: *backend
    command: celery -A whileisleep worker -Q integrations,deliveries --pool threads --concurrency 16 --loglevel info
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_started
    stop_grace_period: 60s

  # The scheduler: once a minute it asks the worker to look for visitor messages whose
  # reply job was lost. Exactly one of these, never scaled.
  beat:
    <<: *backend
    command: celery -A whileisleep beat --loglevel info --schedule /tmp/celerybeat-schedule
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build: ../frontend
    environment:
      # The docs ask it what was edited on a page (frontend/src/lib/docs.ts).
      API_URL: http://web:8000
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whileisleep}
      POSTGRES_USER: ${POSTGRES_USER:-whileisleep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Holds the queue of AI replies waiting for a worker (and rate-limit counters). Every
    # write is logged to disk within a second, so a restart doesn't drop queued replies.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  static:
